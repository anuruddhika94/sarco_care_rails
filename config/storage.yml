test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# S3-compatible object storage, used in production: currently Neon Object
# Storage, which lives in the same Neon project as the database. Works
# unchanged against Cloudflare R2 or S3 itself. Photos are served through the
# app's own /rails/active_storage/... URLs, so the bucket stays private.
# Configured with the env vars below in the Render dashboard; see README.
object_storage:
  service: S3
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  bucket: <%= ENV["S3_BUCKET"] %>
  endpoint: <%= ENV["AWS_ENDPOINT_URL_S3"] %>
  # Neon scopes buckets to a database branch rather than a region, but the
  # SDK still wants a region string.
  region: <%= ENV.fetch("AWS_REGION", "auto") %>
  # Neon serves path-style URLs only (bucket in the path, not the hostname);
  # R2 and S3 accept them too.
  force_path_style: true
  # Neon and R2 both reject the checksums newer aws-sdk-s3 versions send by default.
  request_checksum_calculation: when_required
  response_checksum_validation: when_required

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

